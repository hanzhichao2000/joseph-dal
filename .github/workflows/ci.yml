name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Same self-hosted runner family as joseph-core. A self-hosted runner never executes a fork PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, joseph-core]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No setup-python: the self-hosted runner ships Python 3.12 and its tool cache is per runner.
      # The system Python is externally managed (PEP 668); always work in a venv.
      - run: python3 -c "import sys; assert sys.version_info >= (3, 11), sys.version"
      - name: Check public boundary
        run: python3 tools/check_keywords.py keywords/public-boundary.txt .
      - run: python3 -m unittest discover -s tools -p test_check_keywords.py -v
      - run: python3 -m venv .venv
      - run: .venv/bin/pip install -q -e ".[dev]" -e providers/cnequity
      - run: .venv/bin/ruff check src tests providers
      - run: .venv/bin/ruff format --check src tests providers
      - run: .venv/bin/mypy
      - run: .venv/bin/pytest -q
