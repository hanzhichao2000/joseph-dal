name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -e providers/cnequity
      - run: ruff check src tests providers
      - run: ruff format --check src tests providers
      - run: mypy
      - run: pytest -q
